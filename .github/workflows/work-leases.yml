name: work-leases

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  work-leases:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        optimize: ["0", "1"]
    env:
      PYTHONOPTIMIZE: ${{ matrix.optimize }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run lease-checker fixture tests (nonempty)
        shell: bash
        run: |
          set -euo pipefail
          python -B -S -m unittest discover -s work_leases -p 'test_check_work_leases*.py' -v 2>&1 | tee "$RUNNER_TEMP/work-leases-${PYTHONOPTIMIZE}.log"
          grep -Eq '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/work-leases-${PYTHONOPTIMIZE}.log" || { echo "::error::lease-checker discovery collected zero tests or returned no count"; exit 1; }
